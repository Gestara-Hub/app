esponsável; em outro, registre \"termo impresso arquivado\"."},{"kind":"step","stage":7,"id":"e7-p3","index":3,"total":3,"title":"Etapa 7: alunos menores e responsáveis (8)","html":"Em Arthur (14 anos), matricule depois numa turma de adulto e veja o aviso de idade (etapa 8)."},{"kind":"check","stage":7,"id":"e7-conferir","title":"Etapa 7: alunos menores e responsáveis (8)","expect":"cobrança do menor com o nome do responsável financeiro no Cobrar online (CPF dele); selo some depois do aceite.","db":"\u003ccode>clients.guardians\u003c/code> (responsáveis, \u003ccode>financial\u003c/code>), \u003ccode>legal_consents\u003c/code> (aceite do termo, por quem, quando, IP), \u003ccode>charges\u003c/code> dos menores.","stepCount":3},{"kind":"cover","stage":8,"id":"e8-capa","title":"Etapa 8: matrículas, lista de espera e curso","objective":"matrícula em lote, turma lotada, conflito de horário, curso com parcelas, pacote na turma de pacote.","html":"","stepCount":7},{"kind":"step","stage":8,"id":"e8-p1","index":1,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"\u003cstrong>Jiu-Jitsu Manhã:\u003c/strong> \"Matricular alunos\" → Pedro, Mariana, Lucas, Fernanda, Thiago, Beatriz, Arthur (menor: aviso de idade), Rodrigo, Patrícia, André (11 na turma: a lista da turma ganha busca a partir de 9 alunos)."},{"kind":"step","stage":8,"id":"e8-p2","index":2,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"\u003cstrong>Jiu-Jitsu Noite (4 vagas):\u003c/strong> Pedro, Mariana, Lucas, Isabela. Depois tente Beatriz: \"Turma lotada (0 vagas)\" → \u003cstrong>\"Pôr na lista de espera\"\u003c/strong>. Depois Thiago: \u003cstrong>\"Matricular mesmo assim (5)\"\u003c/strong>. Cancele a matrícula do Lucas na Noite e promova a Beatriz da espera."},{"kind":"step","stage":8,"id":"e8-p3","index":3,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"\u003cstrong>Conflito:\u003c/strong> tente matricular o Pedro numa turma no mesmo dia e horário de outra dele: \"já possui aula ...\"."},{"kind":"step","stage":8,"id":"e8-p4","index":4,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"\u003cstrong>Kids Tarde:\u003c/strong> Enzo, Valentina, Miguel, Sophia, Helena."},{"kind":"step","stage":8,"id":"e8-p5","index":5,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"\u003cstrong>Muay Thai Pacote:\u003c/strong> Camila, Diego, Gustavo (sem pacote: a chamada vai avisar \"Sem pacote\")."},{"kind":"step","stage":8,"id":"e8-p6","index":6,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"\u003cstrong>Judô Curso de Férias:\u003c/strong> Larissa (à vista), Miguel (3x), Davi (4x, 1º vencimento daqui a 7 dias). Veja as parcelas em Cobranças. Cancele a matrícula do Davi: parcelas futuras canceladas, vencidas ficam."},{"kind":"step","stage":8,"id":"e8-p7","index":7,"total":7,"title":"Etapa 8: matrículas, lista de espera e curso","html":"Detalhe da turma: \"Selecionar alunos\" em lote; alertas só quando pedem atenção."},{"kind":"check","stage":8,"id":"e8-conferir","title":"Etapa 8: matrículas, lista de espera e curso","expect":"","db":"\u003ccode>enrollments\u003c/code> (ativas, canceladas, \u003ccode>class_group_id\u003c/code>), \u003ccode>waitlist\u003c/code> (waiting → promoted), \u003ccode>charges\u003c/code> kind \u003ccode>course\u003c/code> (\u003ccode>installment_group_id\u003c/code>, \u003ccode>cycle_index/total\u003c/code>, canceladas pelo sistema com motivo), \u003ccode>audit_logs\u003c/code> (matrícula, promoção).","stepCount":7},{"kind":"cover","stage":9,"id":"e9-capa","title":"Etapa 9: calendário, chamada e aulas","objective":"uma semana de aulas dadas, com presença, falta, justificada, avulso, experimental, pacote, substituto, aula cancelada e registros.","html":"","stepCount":8},{"kind":"step","stage":9,"id":"e9-p1","index":1,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"Calendário: visão grade e lista; filtros por modalidade e instrutor; clique numa aula de hoje (crie turmas com aula hoje; se não houver, ajuste os encontros)."},{"kind":"step","stage":9,"id":"e9-p2","index":2,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"\u003cstrong>Chamada da Manhã (hoje):\u003c/strong> toque em quem veio (4), \"Concluir chamada\" → faltas nos demais; marque uma \u003cstrong>justificada\u003c/strong> pelo ⋮; desmarque uma presença e marque de novo. Tente a chamada numa aula futura: \"A chamada abre em ...\"."},{"kind":"step","stage":9,"id":"e9-p3","index":3,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"\u003cstrong>Adicionar aluno nesta aula\u003c/strong> (drawer): Gustavo como \u003cstrong>avulso\u003c/strong> (gera cobrança de R$ 40,00) e um aluno novo como \u003cstrong>experimental\u003c/strong> (cortesia). Remova um deles pelo ⋮."},{"kind":"step","stage":9,"id":"e9-p4","index":4,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"\u003cstrong>Muay Thai (próxima aula):\u003c/strong> chamada com Camila (gasta 1 de 10), Diego (gasta 1 de 4), Gustavo (\u003cstrong>\"Sem pacote\"\u003c/strong>, âmbar). Falta sem justificativa da Camila na aula seguinte: gasta (regra do pacote); justificada do Diego: não gasta."},{"kind":"step","stage":9,"id":"e9-p5","index":5,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"\u003cstrong>Trocar instrutor\u003c/strong> (drawer): Bruno substitui Carlos numa aula, motivo \"viagem\"; restaure o titular em outra."},{"kind":"step","stage":9,"id":"e9-p6","index":6,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"\u003cstrong>Cancelar uma aula\u003c/strong> e \u003cstrong>mudar o horário\u003c/strong> de outra: aparece \"Avisar os alunos?\" (mensagem para a turma)."},{"kind":"step","stage":9,"id":"e9-p7","index":7,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"\u003cstrong>Registrar a aula\u003c/strong> (turma inteira) com uma anotação e um destaque; no Pedro, abra \"Registros de aula\", crie meta \"Raspagem 0/30\", avance +5, pontos fortes, \"Para a próxima aula\". Repita o registro da turma em 6 aulas da Manhã e faça 5 registros individuais do Pedro: a linha do tempo dele passa de 10 e mostra \"Carregar mais\"."},{"kind":"step","stage":9,"id":"e9-p8","index":8,"total":8,"title":"Etapa 9: calendário, chamada e aulas","html":"Volte 5 dias no calendário e faça a chamada de aulas passadas para ter histórico (presença baixa em alguém: alerta \"Presença baixa\")."},{"kind":"check","stage":9,"id":"e9-conferir","title":"Etapa 9: calendário, chamada e aulas","expect":"","db":"\u003ccode>attendances\u003c/code> (present/absent/justified por aula), \u003ccode>class_reservations\u003c/code> (avulso, experimental, pacote), \u003ccode>class_session_overrides\u003c/code> (substituto, cancelada, horário), \u003ccode>student_packages.usages\u003c/code>, \u003ccode>charges\u003c/code> kind \u003ccode>dropin\u003c/code> (Gustavo), registros e metas em \u003ccode>clients\u003c/code> (progressions/records), \u003ccode>message_logs\u003c/code> (aviso à turma), \u003ccode>audit_logs\u003c/code>.","stepCount":8},{"kind":"cover","stage":10,"id":"e10-capa","title":"Etapa 10: cobranças","objective":"todo o ciclo da cobrança sem o parceiro: pagar, desfazer, cancelar, reabrir, avulsa, atraso, lembretes, troca e pausa de plano, inativação.","html":"","stepCount":9},{"kind":"step","stage":10,"id":"e10-p1","index":1,"total":9,"title":"Etapa 10: cobranças","html":"Cobranças (mês atual): resumo do mês, filtros por tipo (Mensalidades, Aulas avulsas, Cobranças avulsas, Cursos, Pacotes) e situação. Confira Thiago com 4 em atraso e Fernanda \"Isento\"."},{"kind":"step","stage":10,"id":"e10-p2","index":2,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>Marcar pago\u003c/strong> (drawer): Pedro em Pix com comprovante anexado; Mariana em dinheiro; Lucas em cartão com \"Pago em\" ontem. \u003cstrong>Desfazer\u003c/strong> o do Lucas. \u003cstrong>Cancelar\u003c/strong> uma mensalidade com motivo \"Cobrança duplicada\" e \u003cstrong>reabrir\u003c/strong> (recusa se outra cobre o período)."},{"kind":"step","stage":10,"id":"e10-p3","index":3,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>\"+ Nova cobrança\" avulsa:\u003c/strong> Pedro, \"Kimono\", R$ 300,00 em 3 parcelas (resto na 1ª); Enzo, \"Exame de faixa\", R$ 80,00 à vista."},{"kind":"step","stage":10,"id":"e10-p4","index":4,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>Lembretes:\u003c/strong> no Painel, card de lembretes com os atrasados (Thiago); \"Lembrar no WhatsApp\" (assistido abre o WhatsApp; oficial envia). No Histórico de Comunicação, a linha."},{"kind":"step","stage":10,"id":"e10-p5","index":5,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>Troca de plano:\u003c/strong> Beatriz para Mensal Livre com o período atual em aberto (substituída) e Pedro com o período pago (início sugerido no próximo)."},{"kind":"step","stage":10,"id":"e10-p6","index":6,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>Pausar assinatura\u003c/strong> do Gustavo (cadastro → situação); gere o próximo mês (abra Cobranças no mês seguinte): sem mensalidade dele."},{"kind":"step","stage":10,"id":"e10-p7","index":7,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>Inativar\u003c/strong> o Thiago com mensalidades em aberto: \"Manter para receber\"; inative a Mariana: \"Cancelar a cobrança\". Reative o Thiago."},{"kind":"step","stage":10,"id":"e10-p8","index":8,"total":9,"title":"Etapa 10: cobranças","html":"Mês seguinte em Cobranças: mensalidades geradas sozinhas, com o desconto da Mariana ainda válido e a bolsa."},{"kind":"step","stage":10,"id":"e10-p9","index":9,"total":9,"title":"Etapa 10: cobranças","html":"\u003cstrong>Paginação de Cobranças:\u003c/strong> o mês atual tem mais de 20 linhas (mensalidades de 22 alunos, 4 atrasadas do Thiago, avulsas, parcelas do curso, aula avulsa). \"Por página: 10\", navegue até a última, troque de página e mude o filtro de tipo: volta à página 1; os cartões do mês não mudam com a página."},{"kind":"check","stage":10,"id":"e10-conferir","title":"Etapa 10: cobranças","expect":"","db":"\u003ccode>charges\u003c/code> (status, \u003ccode>paid_at\u003c/code>, \u003ccode>method\u003c/code>, \u003ccode>paid_via\u003c/code>, \u003ccode>cancel_reason\u003c/code>, \u003ccode>replaced\u003c/code>, parcelas da avulsa), \u003ccode>attachments\u003c/code> (comprovante), \u003ccode>clients\u003c/code> (\u003ccode>membership_status\u003c/code> paused, status inactive), \u003ccode>message_logs\u003c/code> (lembretes), \u003ccode>audit_logs\u003c/code>.","stepCount":9},{"kind":"cover","stage":11,"id":"e11-capa","title":"Etapa 11: recebimentos online (Asaas sandbox)","objective":"ativar a conta do espaço novo, Pix, link, repasse, fatura pública, cancelamento, extrato, saque.","html":"","stepCount":7},{"kind":"step","stage":11,"id":"e11-p1","index":1,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"Recebimentos online: tela antes de ativar (simulação \"Quanto você recebe\"), \u003cstrong>Ativar\u003c/strong> com CPF/CNPJ fictício válido e e-mail novo (o Asaas recusa e-mail já usado: a mensagem deve ser neutra e focar o campo). Aprove no sandbox pelo botão da tela. Tour da tela aparece uma vez."},{"kind":"step","stage":11,"id":"e11-p2","index":2,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"Conexão: tarifas sincronizadas (Pix promocional), webhook registrado (túnel), chave Pix criada (primeiro Pix já sai)."},{"kind":"step","stage":11,"id":"e11-p3","index":3,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"Cobranças → Pedro → \u003cstrong>Cobrar online\u003c/strong> → Pix: QR, copia e cola, \"Enviar pelo WhatsApp\"; \u003cstrong>Simular liquidação\u003c/strong>. Em Recebimentos, a linha com taxas; no Financeiro, \"Entrou\" cheio e \"Saiu\" com as taxas (popover). Outra cobrança por \u003cstrong>link\u003c/strong> (cartão) com \u003cstrong>repasse da taxa\u003c/strong> ao aluno: o aluno paga a mais, líquido igual ao valor."},{"kind":"step","stage":11,"id":"e11-p4","index":4,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"\u003cstrong>Fatura pública\u003c/strong> \u003ccode>/p/c/&lt;código&gt;\u003c/code>: abra em janela anônima (dados mascarados), escolha a forma; menor sem responsável financeiro pede cadastro."},{"kind":"step","stage":11,"id":"e11-p5","index":5,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"Gere um novo código para a mesma cobrança: o anterior é cancelado no Asaas. Pague uma cobrança à mão com Pix em aberto: o código é cancelado."},{"kind":"step","stage":11,"id":"e11-p6","index":6,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"Extrato em PDF do mês; \"Sacar via Pix\" (janela, sem transferir); Configurações da aba (validade do Pix, formas aceitas, repasse)."},{"kind":"step","stage":11,"id":"e11-p7","index":7,"total":7,"title":"Etapa 11: recebimentos online (Asaas sandbox)","html":"\u003cstrong>Paginação de Recebimentos:\u003c/strong> gere Pix para 11 alunos (Cobrar online em cada mensalidade) e simule a liquidação de 5: o histórico passa de 10 linhas; teste as setas, o \"por página\" e o filtro \"Pagas e aguardando\" versus \"Aguardando\"."},{"kind":"check","stage":11,"id":"e11-conferir","title":"Etapa 11: recebimentos online (Asaas sandbox)","expect":"","db":"\u003ccode>organizations\u003c/code> (gateway_status, \u003ccode>gateway_fees\u003c/code>, \u003ccode>gateway_webhook_url\u003c/code>), \u003ccode>online_payments\u003c/code> (status, \u003ccode>split_amount_cents\u003c/code>, \u003ccode>gateway_fee_cents\u003c/code>, \u003ccode>net_amount_cents\u003c/code>, \u003ccode>fee_passed_to_customer\u003c/code>, \u003ccode>public_code\u003c/code>, cancelados com motivo), \u003ccode>webhook_events\u003c/code> (asaas, processed), \u003ccode>charges\u003c/code> (\u003ccode>paid_via\u003c/code> online), \u003ccode>financial\u003c/code> (linha de taxas), \u003ccode>audit_logs\u003c/code> (inclusive o ator de sistema do webhook).","stepCount":7},{"kind":"cover","stage":12,"id":"e12-capa","title":"Etapa 12: evolução do aluno","objective":"faixas, graus, graduação, certificado de graduação, notas e medidas.","html":"","stepCount":5},{"kind":"step","stage":12,"id":"e12-p1","index":1,"total":5,"title":"Etapa 12: evolução do aluno","html":"Pedro: \"Definir faixa\" → Branca com \"Ponto de partida\" há 14 meses (veio de outra academia). Dê 2 graus. A trilha mostra o progresso pelo critério (presenças e tempo) e \"Apto\" quando bater; \u003cstrong>Graduar\u003c/strong> para Azul (examinador: Carlos). Veja o selo na lista e na chamada."},{"kind":"step","stage":12,"id":"e12-p2","index":2,"total":5,"title":"Etapa 12: evolução do aluno","html":"Enzo (kids): nível por idade; ao fazer 16 anos (ajuste a data de nascimento de um aluno para testar) a chamada avisa a troca de nível pela idade."},{"kind":"step","stage":12,"id":"e12-p3","index":3,"total":5,"title":"Etapa 12: evolução do aluno","html":"\u003cstrong>Certificado de graduação:\u003c/strong> no diálogo de Graduação, \"Certificado\" na linha da promoção; prévia, PDF, \"Voltar\" sem loop; Configurações → Certificado: aba Graduação, galeria de modelos, editor com variáveis \u003ccode>{aluno}\u003c/code> \u003ccode>{etapa}\u003c/code>, assinatura por arrastar."},{"kind":"step","stage":12,"id":"e12-p4","index":4,"total":5,"title":"Etapa 12: evolução do aluno","html":"\u003cstrong>Notas (Judô):\u003c/strong> detalhe da turma → aba Avaliações → nova avaliação \"Prova de quedas\" peso 2; lance notas (uma ausente); boletim \"Notas\" do Miguel com média e aprovação; tente lançar com o professor de outra turma (etapa 15)."},{"kind":"step","stage":12,"id":"e12-p5","index":5,"total":5,"title":"Etapa 12: evolução do aluno","html":"\u003cstrong>Medidas:\u003c/strong> registre peso e altura de dois alunos (medidas da modalidade) e veja a evolução."},{"kind":"check","stage":12,"id":"e12-conferir","title":"Etapa 12: evolução do aluno","expect":"","db":"\u003ccode>clients.progressions\u003c/code> (nível, graus, \u003ccode>promotion_history\u003c/code> com examinador), \u003ccode>issued_certificates\u003c/code> (kind graduation, \u003ccode>verification_code\u003c/code>), \u003ccode>assessments\u003c/code> (grades), \u003ccode>student_measurements\u003c/code>, \u003ccode>audit_logs\u003c/code>.","stepCount":5},{"kind":"cover","stage":13,"id":"e13-capa","title":"Etapa 13: comunicação","objective":"modelos, envio assistido e oficial, lembretes, mensagem para vários, horário de envio, histórico.","html":"","stepCount":5},{"kind":"step","stage":13,"id":"e13-p1","index":1,"total":5,"title":"Etapa 13: comunicação","html":"Mensagens: edite o modelo de boas-vindas (variáveis), desligue \"Pacote acabando\" e religue; sugestões por área."},{"kind":"step","stage":13,"id":"e13-p2","index":2,"total":5,"title":"Etapa 13: comunicação","html":"Conexão: no espaço novo, \u003cstrong>assistido\u003c/strong> por padrão. Teste \"Lembrar no WhatsApp\" em dois alunos (abre o WhatsApp com o texto; registra \"Aberto no WhatsApp\"). Conecte o oficial (atalho) e repita com o Pedro (texto livre dentro da janela; fora, a Meta descarta; por modelo depende da forma de pagamento na Meta). Horário de envio 08:00 a 20:00."},{"kind":"step","stage":13,"id":"e13-p3","index":3,"total":5,"title":"Etapa 13: comunicação","html":"\"+ Nova mensagem\" para vários alunos (a turma Jiu-Jitsu Manhã inteira, 11 alunos) e avulsa para um: o Histórico passa de 10 linhas."},{"kind":"step","stage":13,"id":"e13-p4","index":4,"total":5,"title":"Etapa 13: comunicação","html":"Painel: card de lembretes (atrasados, pacote acabando, três faltas, aniversário, boas-vindas pendentes, avanço de nível); adiar um; o sino com os avisos do espaço."},{"kind":"step","stage":13,"id":"e13-p5","index":5,"total":5,"title":"Etapa 13: comunicação","html":"Histórico: filtros por tipo e status; ao clicar, o aluno; aba no cadastro do aluno com as mensagens dele. \u003cstrong>Paginação:\u003c/strong> \"por página: 10\", navegue e confira que mudar o filtro de status volta à página 1."},{"kind":"check","stage":13,"id":"e13-conferir","title":"Etapa 13: comunicação","expect":"","db":"\u003ccode>message_templates\u003c/code> (enabled, content), \u003ccode>whatsapp_connections\u003c/code> (status, franquia), \u003ccode>message_logs\u003c/code> (opened/queued/sent, trigger, client_id), \u003ccode>audit_logs\u003c/code>.","stepCount":5},{"kind":"cover","stage":14,"id":"e14-capa","title":"Etapa 14: financeiro, professores e relatórios","objective":"lançamentos, recorrência, categorias, pagamento dos professores, DRE e os 8 relatórios.","html":"","stepCount":4},{"kind":"step","stage":14,"id":"e14-p1","index":1,"total":4,"title":"Etapa 14: financeiro, professores e relatórios","html":"Financeiro → Lançamentos: despesa \"Aluguel\" R$ 2.000,00 recorrente (todo mês, dia 5), \"Material\" avulsa paga hoje com anexo, receita \"Venda de kimono\" R$ 350,00, e mais 6 lançamentos simples (luz, água, internet, marketing, evento, outras receitas). Marcar pago, desfazer, cancelar; encerrar a recorrência. Categorias: criar \"Água\" e inativar. \u003cstrong>Paginação de Lançamentos:\u003c/strong> com as linhas agregadas das cobranças, os pagamentos dos professores (etapa 14.3) e os 9 lançamentos, a lista passa de 10: \"por página: 10\", setas e filtro por categoria voltando à página 1."},{"kind":"step","stage":14,"id":"e14-p2","index":2,"total":4,"title":"Etapa 14: financeiro, professores e relatórios","html":"Resumo: Entrou, Saiu (popover das taxas online), Saldo, Em atraso, Contas a pagar; visão Avançada com o gráfico; Bolsas concedidas."},{"kind":"step","stage":14,"id":"e14-p3","index":3,"total":4,"title":"Etapa 14: financeiro, professores e relatórios","html":"\u003cstrong>Professores:\u003c/strong> regras: Carlos fixo R$ 1.500 + R$ 20 por aula; Ana R$ 30 por aula; Rafael 60% do que os alunos pagaram (pacote); Juliana por aluno R$ 15; Bruno por aula (substituição conta para ele). Prévia do mês, ajustes, \u003cstrong>fechar\u003c/strong> e \u003cstrong>pagar\u003c/strong>; o pagamento vira saída no Resumo e no Lançamentos."},{"kind":"step","stage":14,"id":"e14-p4","index":4,"total":4,"title":"Etapa 14: financeiro, professores e relatórios","html":"Relatórios: os 8 do catálogo (lista por categoria, mês dentro do relatório), PDF e CSV de cada; DRE com \"Deduções\" das taxas online."},{"kind":"check","stage":14,"id":"e14-conferir","title":"Etapa 14: financeiro, professores e relatórios","expect":"","db":"\u003ccode>financial_entries\u003c/code>, \u003ccode>financial_recurrences\u003c/code>, \u003ccode>financial_categories\u003c/code>, \u003ccode>teacher_pay_rules\u003c/code>, \u003ccode>teacher_payouts\u003c/code> (closed → paid), \u003ccode>attachments\u003c/code>, \u003ccode>audit_logs\u003c/code>.","stepCount":4},{"kind":"cover","stage":15,"id":"e15-capa","title":"Etapa 15: perfis, permissões e segurança","objective":"cada perfil vê e faz só o que pode; auditoria; 2FA.","html":"","stepCount":5},{"kind":"step","stage":15,"id":"e15-p1","index":1,"total":5,"title":"Etapa 15: perfis, permissões e segurança","html":"Entre como \u003cstrong>Carlos (profissional)\u003c/strong> em janela anônima: só as próprias turmas no Calendário e em Turmas; chamada da própria aula; \"Registrar aula\" e graduação (se tiver \u003ccode>progression:manage\u003c/code>); não vê Cobranças nem Financeiro; tenta abrir \u003ccode>/finance\u003c/code> pela URL (recusa). Substituição: a aula em que Bruno substituiu Carlos aparece para Bruno (crie acesso para ele) e não para Carlos."},{"kind":"step","stage":15,"id":"e15-p2","index":2,"total":5,"title":"Etapa 15: perfis, permissões e segurança","html":"\u003cstrong>Marcos (atendente):\u003c/strong> alunos, matrícula, chamada, cobranças (ver, não gerenciar?), sem Financeiro, sem Usuários."},{"kind":"step","stage":15,"id":"e15-p3","index":3,"total":5,"title":"Etapa 15: perfis, permissões e segurança","html":"\u003cstrong>Juliana (gerente):\u003c/strong> tudo menos usuários dono/gerente; Auditoria só com os eventos permitidos."},{"kind":"step","stage":15,"id":"e15-p4","index":4,"total":5,"title":"Etapa 15: perfis, permissões e segurança","html":"\u003cstrong>Auditoria\u003c/strong> (dono): filtros O quê, Ação, Quem, Período; grupos por dia; drawer com \"Abrir aluno/turma\"; eventos sensíveis; ator de sistema (webhook, rotinas). \"Carregar mais eventos\" até o fim (a esta altura há centenas), e o contador \"N de total\"."},{"kind":"step","stage":15,"id":"e15-p5","index":5,"total":5,"title":"Etapa 15: perfis, permissões e segurança","html":"\u003cstrong>Segurança:\u003c/strong> troque a senha; ligue o 2FA por aplicativo (TOTP), códigos de recuperação, dispositivo lembrado; \"Esqueci minha senha\" por e-mail; os 4 momentos do aviso de 2FA."},{"kind":"check","stage":15,"id":"e15-conferir","title":"Etapa 15: perfis, permissões e segurança","expect":"","db":"\u003ccode>users\u003c/code> (profile, \u003ccode>professional_id\u003c/code>), \u003ccode>audit_logs\u003c/code> (\u003ccode>security\u003c/code>, \u003ccode>source\u003c/code>), \u003ccode>two_factor_*\u003c/code>, \u003ccode>trusted_devices\u003c/code>, \u003ccode>password_reset_tokens\u003c/code>.","stepCount":5},{"kind":"cover","stage":16,"id":"e16-capa","title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","objective":"fim do curso, certificado de conclusão, inativações e exclusões, plano GestaraHub, passada no celular.","html":"","stepCount":5},{"kind":"step","stage":16,"id":"e16-p1","index":1,"total":5,"title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","html":"Judô Curso de Férias: ajuste \"Termina em\" para ontem → \"Encerrado\"/\"Concluído\"; emitir certificado de conclusão (um e em lote), verificação pública pelo código em janela anônima."},{"kind":"step","stage":16,"id":"e16-p2","index":2,"total":5,"title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","html":"Plano GestaraHub: Configurações → Plano: ver Grátis, \"Ativar Profissional\" (sandbox: Simular pagamento), troca mensal↔anual, downgrade no fim do período, fatura do plano, franquia de WhatsApp."},{"kind":"step","stage":16,"id":"e16-p3","index":3,"total":5,"title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","html":"LGPD: inativar aluno, pedido de exclusão do aluno (o que fica retido), inativar professor com pagamentos; zona de perigo do espaço (só olhar as travas)."},{"kind":"step","stage":16,"id":"e16-p4","index":4,"total":5,"title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","html":"\u003cstrong>Celular\u003c/strong> (Chrome iOS ou Android, ou o modo responsivo): Painel, Calendário, chamada por toque, cadastro de aluno (sem zoom nos campos), Cobranças, menu lateral com o tour, dark mode."},{"kind":"step","stage":16,"id":"e16-p5","index":5,"total":5,"title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","html":"Preferências: tema, cor, som; \"Me mostre na tela\" na Ajuda para dois guias."},{"kind":"check","stage":16,"id":"e16-conferir","title":"Etapa 16: encerramentos, certificados de curso, LGPD e celular","expect":"","db":"\u003ccode>class_groups\u003c/code> (fim), \u003ccode>issued_certificates\u003c/code> (course, lote), \u003ccode>clients\u003c/code> (status, exclusão), \u003ccode>subscription_events\u003c/code>, \u003ccode>user_preferences\u003c/code>, \u003ccode>audit_logs\u003c/code>.","stepCount":5}]}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("data").textContent);
  var slides = data.slides;
  var KEY = "qa-roteiro:" + data.source;
  var state = load();
  var i = Math.min(state.pos || 0, slides.length - 1);

  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function save() { try { state.pos = i; localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function done(id) { return !!(state.done && state.done[id]); }
  function setDone(id, v) { state.done = state.done || {}; if (v) state.done[id] = true; else delete state.done[id]; save(); }
  function note(id) { return (state.notes && state.notes[id]) || ""; }
  function setNote(id, v) { state.notes = state.notes || {}; if (v.trim()) state.notes[id] = v; else delete state.notes[id]; save(); }
  function stageSteps(n) { return slides.filter(function (s) { return s.kind === "step" && s.stage === n; }); }
  function stageDone(n) { var st = stageSteps(n); var d = st.filter(function (s) { return done(s.id); }).length; return { done: d, total: st.length, all: d === st.length && st.length > 0, checked: done("e" + n + "-conferir") }; }
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove("show"); }, 1800); }
  function copy(text) { return (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast("Copiado. Cole no chat com o agente."); }, function () { prompt("Copie o texto:", text); }); }
  function stageNotes(n) {
    return stageSteps(n).map(function (s) { var v = note(s.id); return v ? "- Passo " + s.index + ": " + v : ""; }).filter(Boolean).concat(note("e" + n + "-conferir") ? ["- Conferência: " + note("e" + n + "-conferir")] : []);
  }

  function renderRail() {
    var ol = document.getElementById("stages");
    ol.innerHTML = "";
    var cur = slides[i].stage;
    var li0 = document.createElement("li");
    li0.innerHTML = '<button class="' + (cur === 0 ? "active" : "") + '" data-go="0"><span class="dot">i</span>Como usar</button>';
    ol.appendChild(li0);
    data.stages.forEach(function (st) {
      var d = stageDone(st.number);
      var cls = d.checked ? "done" : d.done > 0 ? "partial" : "";
      var li = document.createElement("li");
      var first = slides.findIndex(function (s) { return s.stage === st.number; });
      li.innerHTML = '<button class="' + (cur === st.number ? "active" : "") + '" data-go="' + first + '"><span class="dot ' + cls + '">' + (d.checked ? "✓" : st.number) + '</span><span>' + st.title + '</span></button>';
      ol.appendChild(li);
    });
    ol.querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { go(Number(b.getAttribute("data-go"))); document.getElementById("rail").classList.remove("open"); }); });
  }

  function render() {
    var s = slides[i];
    var card = document.getElementById("card");
    var html = "";
    if (s.kind === "info") {
      html = '<p class="kicker">Antes de começar</p><h2>' + s.title + "</h2>" + s.html;
    } else if (s.kind === "cover") {
      html = '<p class="kicker">Etapa ' + s.stage + " · " + s.stepCount + " passos</p><h2>" + s.title.replace(/^Etapa \d+: /, "") + "</h2>" +
        (s.objective ? '<p class="objective"><strong>Objetivo:</strong> ' + s.objective + "</p>" : "") +
        '<div class="table-scroll">' + s.html + "</div>";
    } else if (s.kind === "step") {
      var d = done(s.id);
      html = '<p class="kicker">' + s.title + "</p>" +
        '<div class="step-num">' + s.index + "</div>" +
        '<p class="instruction">' + s.html + "</p>" +
        '<label class="done ' + (d ? "on" : "") + '"><input type="checkbox" id="chk" ' + (d ? "checked" : "") + " /> Feito</label>" +
        '<textarea id="note" placeholder="Anote o que estranhou neste passo (fica salvo aqui no navegador)">' + note(s.id).replace(/</g, "&lt;") + "</textarea>";
    } else if (s.kind === "check") {
      var sd = stageDone(s.stage);
      html = '<p class="kicker">' + s.title + "</p><h2>Conferir a etapa " + s.stage + "</h2>" +
        '<p>' + sd.done + " de " + sd.total + " passos marcados como feitos.</p>" +
        (s.expect ? '<div class="check-box expect"><strong>Você deve ver:</strong> ' + s.expect + "</div>" : "") +
        (s.db ? '<div class="check-box db"><strong>O agente confere no banco:</strong> ' + s.db + "</div>" : "") +
        '<textarea id="note" placeholder="Achados da etapa (vão junto no aviso ao agente)">' + note(s.id).replace(/</g, "&lt;") + "</textarea>" +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">' +
        '<button class="btn ok" id="copy">Copiar aviso: "Etapa ' + s.stage + ' feita"</button>' +
        '<label class="done ' + (done(s.id) ? "on" : "") + '" style="margin:0"><input type="checkbox" id="chk" ' + (done(s.id) ? "checked" : "") + " /> Etapa concluída</label></div>";
    }
    card.innerHTML = html;
    var chk = document.getElementById("chk");
    if (chk) chk.addEventListener("change", function () { setDone(s.id, chk.checked); chk.parentElement.classList.toggle("on", chk.checked); renderRail(); });
    var nt = document.getElementById("note");
    if (nt) nt.addEventListener("input", function () { setNote(s.id, nt.value); });
    var cp = document.getElementById("copy");
    if (cp) cp.addEventListener("click", function () {
      var lines = ["Etapa " + s.stage + " feita"].concat(stageNotes(s.stage));
      copy(lines.join("\n"));
    });
    document.getElementById("pos").textContent = s.kind === "step" ? "Etapa " + s.stage + " · passo " + s.index + " de " + s.total : s.kind === "cover" ? "Etapa " + s.stage + " · capa" : s.kind === "check" ? "Etapa " + s.stage + " · conferência" : s.title;
    document.getElementById("count").textContent = (i + 1) + " / " + slides.length;
    document.getElementById("progress").style.width = ((i + 1) / slides.length * 100) + "%";
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === slides.length - 1;
    renderRail();
    window.scrollTo(0, 0);
  }

  function go(n) { i = Math.max(0, Math.min(slides.length - 1, n)); save(); render(); }
  document.getElementById("prev").addEventListener("click", function () { go(i - 1); });
  document.getElementById("next").addEventListener("click", function () { go(i + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
    if (e.key === "ArrowRight" || e.key === "j") go(i + 1);
    if (e.key === "ArrowLeft" || e.key === "k") go(i - 1);
  });
  document.getElementById("menu").addEventListener("click", function () { document.getElementById("rail").classList.toggle("open"); });
  document.getElementById("theme").addEventListener("click", function () {
    var r = document.documentElement; var cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Limpar todas as marcações e anotações deste roteiro?")) return;
    state = {}; i = 0; save(); render();
  });
  document.getElementById("export").addEventListener("click", function () {
    var out = ["# Anotações do roteiro: " + data.title, ""];
    data.stages.forEach(function (st) {
      var d = stageDone(st.number);
      out.push("## Etapa " + st.number + ": " + st.title + " (" + d.done + "/" + d.total + (d.checked ? ", concluída" : "") + ")");
      var n = stageNotes(st.number);
      out.push(n.length ? n.join("\n") : "- sem anotações");
      out.push("");
    });
    var blob = new Blob([out.join("\n")], { type: "text/markdown" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "anotacoes-roteiro.md"; a.click();
  });
  render();
})();
</script>
